{# 详情页信息行的字段图标（按 label 映射；未命中的走 tag 兜底） #}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
    stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 h-4 w-4 shrink-0 opacity-50" aria-hidden="true">
    {% if label == '导演' %}
    <rect x="3" y="4" width="18" height="16" rx="2" />
    <path d="M8 4v16M16 4v16M3 9.5h5M3 14.5h5M16 9.5h5M16 14.5h5" />
    {% elif label == '编剧' %}
    <path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 3 21.5l1-4.5z" />
    {% elif label == '主演' %}
    <circle cx="9" cy="8" r="3" />
    <path d="M3.5 20a5.5 5.5 0 0 1 11 0" />
    <path d="M16.5 4.5a3 3 0 0 1 0 6.5M18 14.5a5.5 5.5 0 0 1 3 5.5" />
    {% elif label == '更新' or label == '上映' %}
    <rect x="3" y="4.5" width="18" height="16" rx="2" />
    <path d="M8 2.5v4M16 2.5v4M3 10h18" />
    {% elif label == '片长' %}
    <circle cx="12" cy="12" r="9" />
    <path d="M12 7v5l3.5 2" />
    {% elif label == '豆瓣' %}
    <path d="m12 3.5 2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.9l6-.9z" />
    {% elif label == '集数' %}
    <path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" />
    {% else %}
    <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" />
    {% endif %}
</svg>
